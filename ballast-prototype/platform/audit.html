<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Governance Audit Trail · Ballast Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css?v=8" />
</head>
<body data-page="audit">
  <main class="content">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2 font-mono text-[11px] text-slate-500 uppercase tracking-wider mb-1.5">
          <span class="text-sky-700 font-bold">Ballast Operations</span>
          <span class="text-slate-300">/</span>
          <span>Security &amp; Compliance Trail</span>
          <span class="text-slate-300">/</span>
          <span class="text-slate-600 font-medium">Immutable Chain</span>
        </div>
        <h1 class="font-display text-2xl md:text-3xl font-bold text-ink tracking-tight">Platform Audit Trail</h1>
        <p class="text-xs text-slate-500 mt-1 max-w-2xl leading-relaxed">
          Cryptographically attributed event log recording every privileged governance action, scraper configuration change, rule publication, and tenant intervention.
        </p>
      </div>

      <button id="exportBtn" class="btn btn-ghost btn-sm" onclick="UI.toast('Exporting cryptographic audit log (CSV)', 'info')">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Audit Ledger
      </button>
    </div>

    <!-- Filter Surface -->
    <div class="card p-3 mb-4 space-y-3">
      <div class="flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-[240px]">
          <svg class="absolute left-3 top-2.5 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="auditSearch" class="field !pl-9 !py-1.5 !text-xs bg-slate-50/70 focus:bg-white font-medium" placeholder="Search by operator, action description, target entity, or IP address..." />
        </div>
        <span class="font-mono text-xs px-2.5 py-1 bg-slate-100 rounded-lg text-slate-600 font-semibold" id="count"></span>
      </div>

      <div class="flex flex-wrap items-center gap-2 pt-2 border-t hairline">
        <span class="font-mono text-[10.5px] font-bold text-slate-400 uppercase tracking-wider pr-1">Privileged Actor:</span>
        <div class="flex flex-wrap gap-1.5" id="actorFilters"></div>
      </div>
    </div>

    <!-- Timeline List -->
    <div class="card overflow-hidden shadow-xs divide-y divide-slate-100" id="logList"></div>
  </main>

  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/platform-data.js?v=8"></script>
  <script src="../assets/js/platform-layout.js?v=8"></script>
  <script>
    const P = window.PLATFORM;
    let filter = 'all';
    let query = '';
    const actors = ['all', ...new Set(P.audit.map(a=>a.actor))];

    function renderFilters(){
      document.getElementById('actorFilters').innerHTML = actors.map(a=>
        `<button class="btn-chip ${filter===a?'active':''}" data-a="${a}">${a==='all'?'All Operators':a}</button>`).join('');
      document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{filter=b.dataset.a;render();});
    }

    document.getElementById('auditSearch').addEventListener('input', (e) => {
      query = e.target.value.toLowerCase().trim();
      render();
    });

    function render(){
      renderFilters();
      const list = P.audit.filter(a => {
        const matchActor = filter === 'all' || a.actor === filter;
        const matchQuery = !query ||
          a.action.toLowerCase().includes(query) ||
          a.actor.toLowerCase().includes(query) ||
          a.target.toLowerCase().includes(query) ||
          a.meta.toLowerCase().includes(query);
        return matchActor && matchQuery;
      });

      document.getElementById('count').textContent = `${list.length} events logged`;
      document.getElementById('logList').innerHTML = list.map(a => `
        <div class="flex items-start gap-4 p-4 hover:bg-slate-50 transition-colors group">
          <div class="w-8 h-8 rounded-lg bg-slate-100 grid place-items-center text-slate-600 flex-none mt-0.5">
            ${UI.icon('activity','w-4 h-4')}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-bold text-xs text-ink group-hover:text-sky-700 transition">${a.action}</span>
              <span class="pill st-info !py-0.2 font-mono text-[9.5px]">${a.target}</span>
            </div>
            <div class="text-[11px] font-mono text-slate-500 mt-1">${a.meta}</div>
          </div>
          <div class="text-right flex-none font-mono">
            <div class="text-xs font-semibold text-slate-700">${a.actor}</div>
            <div class="text-[10px] text-slate-400 mt-0.5">${a.ts}</div>
          </div>
        </div>
      `).join('') || `<div class="p-12 text-center font-mono text-xs text-slate-400">No audit events match your search.</div>`;
    }
    render();
  </script>
</body>
</html>
