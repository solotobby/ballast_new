<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evidence Vault · Ballast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css?v=8" />
</head>
<body data-page="evidence">
  <main class="content">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2 font-mono text-[11px] text-slate-500 uppercase tracking-wider mb-1.5">
          <span class="text-sky-700 font-bold">The Copper Kettle</span>
          <span class="text-slate-300">/</span>
          <span>Proof &amp; Certification Archive</span>
          <span class="text-slate-300">/</span>
          <span class="text-slate-600 font-medium">Statutory Dossier</span>
        </div>
        <h1 class="font-display text-2xl md:text-3xl font-bold text-ink tracking-tight">Evidence Vault</h1>
        <p class="text-xs text-slate-500 mt-1 max-w-2xl leading-relaxed">
          Tamper-evident repository of statutory certificates, risk assessments, test slips, and insurance policies mapped directly to applicable legislation.
        </p>
      </div>

      <button class="btn btn-primary btn-sm" id="upload">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload Certificate / Policy
      </button>
    </div>

    <!-- Summary strip -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5" id="evSummary"></div>

    <!-- Filter Surface -->
    <div class="card p-3 mb-5 space-y-3">
      <div class="flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-[240px]">
          <svg class="absolute left-3 top-2.5 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="evSearch" class="field !pl-9 !py-1.5 !text-xs bg-slate-50/70 focus:bg-white font-medium" placeholder="Search by certificate title, duty ID, or issuer..." />
        </div>
        <span class="font-mono text-xs px-2.5 py-1 bg-slate-100 rounded-lg text-slate-600 font-semibold" id="count"></span>
      </div>

      <div class="flex flex-wrap items-center gap-2 pt-2 border-t hairline">
        <span class="font-mono text-[10.5px] font-bold text-slate-400 uppercase tracking-wider pr-1">Document Status:</span>
        <div id="stateFilters" class="flex flex-wrap gap-1.5"></div>
      </div>
    </div>

    <!-- Document Cards Grid -->
    <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/layout.js?v=8"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const B = window.BALLAST;
    const items = [...B.evidence];
    let filter = 'all';
    let query = '';

    async function loadLiveEvidence() {
      try {
        const live = await BallastAPI.evidence.list();
        if (Array.isArray(live) && live.length > 0) {
          items.length = 0;
          live.forEach(e => {
            items.push({
              id: 'EV-' + e.id.slice(-4).toUpperCase(),
              title: e.name || 'Statutory Certificate',
              obl: e.obligation?.definitionId || 'OBL-001',
              expires: e.expiresAt ? e.expiresAt.split('T')[0] : '2027-01-20',
              evState: e.status === 'valid' ? 'valid' : (e.status === 'expiring' ? 'expiring' : 'expired'),
              fileId: e.id,
            });
          });
          render();
        }
      } catch (err) {
        console.warn('Evidence using local data:', err.message);
      }
    }
    loadLiveEvidence();

    function renderSummary() {
      const sum = [
        ['Valid & Certified', items.filter(e=>e.evState==='valid').length, 'Meets statutory inspection criteria', '#047857', 'border-l-emerald-500'],
        ['Expiring Soon', items.filter(e=>e.evState==='expiring').length, 'Requires engineer / surveyor renewal', '#B45309', 'border-l-amber-500'],
        ['Expired / Lapsed', items.filter(e=>e.evState==='expired').length, 'Immediate breach — schedule inspection', '#B91C1C', 'border-l-rose-500']
      ];
      document.getElementById('evSummary').innerHTML = sum.map(([l,v,sub,c,borderCls])=>`
        <div class="card p-4 border-l-4 ${borderCls}">
          <div class="flex items-center justify-between mb-1">
            <span class="font-mono text-xs text-slate-500 font-semibold">${l}</span>
            <span class="dot" style="background:${c}"></span>
          </div>
          <div class="font-display text-3xl font-extrabold tnum tracking-tight" style="color:${c}">${v}</div>
          <div class="text-[11px] font-mono text-slate-400 mt-1">${sub}</div>
    function render(){
      renderSummary();
      renderFilters();
      const list = items.filter(e => {
        const matchState = filter === 'all' || e.evState === filter;
        const matchQuery = !query ||
          e.title.toLowerCase().includes(query) ||
          e.id.toLowerCase().includes(query) ||
          e.obl.toLowerCase().includes(query);
        return matchState && matchQuery;
      });

      document.getElementById('count').textContent = `${list.length} documents`;
      document.getElementById('grid').innerHTML = list.map(e=>{
        const obl = B.oblById(e.obl);
        return `
          <div class="card card-interactive p-4 flex flex-col justify-between group">
            <div>
              <div class="flex items-start justify-between gap-2 mb-2">
                <span class="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 border hairline">PDF</span>
                ${UI.evPill(e.evState)}
              </div>
              <div class="font-semibold text-ink group-hover:text-sky-700 transition leading-snug">${e.title}</div>
              <div class="text-[11px] font-mono text-slate-400 mt-1">ID: ${e.id}</div>
              
              <div class="mt-3 p-2 rounded-lg bg-slate-50 border hairline">
                <div class="text-[10px] font-mono text-slate-400 uppercase">Linked Statute</div>
                <div class="text-xs font-semibold text-slate-700 truncate mt-0.5">${obl ? obl.title : e.obl}</div>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t hairline flex items-center justify-between font-mono text-[11px] text-slate-500">
              <span>Expires: <strong class="text-slate-800">${UI.fmtDate(e.expires)}</strong></span>
              <button class="text-sky-700 hover:underline font-semibold" onclick="UI.toast('Opening certificate document preview...', 'info')">View &rarr;</button>
            </div>
          </div>
        `;
      }).join('') || `<div class="col-span-3 text-center font-mono text-xs text-slate-400 py-12">No documents match the specified filter.</div>`;
    }
    render();

    // Check if URL has ?upload=true
    if (new URLSearchParams(location.search).get('upload')) {
      setTimeout(() => openUploadModal(), 100);
    }
    document.getElementById('upload').onclick = openUploadModal;

    function openUploadModal() {
      const oblOpts = B.obligations.map(o=>`<option value="${o.id}">${o.id} — ${o.title}</option>`).join('');
      const body = `
        <div class="space-y-4 font-sans">
          <div><label class="label">Certificate / Evidence Title</label>
            <input class="field text-xs" id="u-title" placeholder="e.g. Annual Commercial Kitchen Gas Safety Record (CP42)"></div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div><label class="label">Linked Statutory Obligation</label>
              <select class="field text-xs font-mono" id="u-obl">${oblOpts}</select></div>
            <div><label class="label">Expiry / Renewal Date</label>
              <input type="date" class="field text-xs font-mono" id="u-exp" value="2027-09-23"></div>
          </div>
          <div><label class="label">File Upload (PDF, PNG, JPG)</label>
            <div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center text-xs text-slate-500 bg-slate-50 hover:bg-slate-100/60 transition cursor-pointer">
              ${UI.icon('upload','w-6 h-6 mx-auto mb-1.5 text-slate-400')}Drag official test certificate or click to browse
            </div>
          </div>
        </div>`;
      const footer = `<button class="btn btn-ghost btn-sm" data-close>Cancel</button>
        <button class="btn btn-primary btn-sm" id="saveUpload">${UI.icon('check','w-3.5 h-3.5')}Archive to Vault</button>`;
      const m = UI.modal('Upload Statutory Evidence', body, footer);
      m.el.querySelector('#saveUpload').onclick = ()=>{
        const title = m.el.querySelector('#u-title').value || 'Statutory Inspection Certificate';
        const obl = m.el.querySelector('#u-obl').value;
        const exp = m.el.querySelector('#u-exp').value;
        items.unshift({ id:'EV-'+(990+items.length), title, obl, expires:exp, evState:'valid' });
        m.close(); render(); UI.toast('Certificate verified and encrypted in vault', 'success');
      };
    }
  </script>
</body>
</html>
