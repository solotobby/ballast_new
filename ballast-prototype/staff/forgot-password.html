<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset password · Ballast for staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css?v=8" />
  <link rel="stylesheet" href="../assets/css/staff.css" />
</head>
<body class="staff" style="background:#0E1319;min-height:100vh">
  <div class="min-h-screen flex flex-col" style="padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)">
    <div class="flex-1 flex flex-col items-center justify-center px-6 text-center text-white relative overflow-hidden">
      <div class="absolute -top-16 w-72 h-72 rounded-full" style="background:radial-gradient(circle,#1F7DB4,transparent 70%);opacity:.5"></div>
      <div class="w-14 h-14 rounded-2xl grid place-items-center mb-5 relative" style="background:linear-gradient(150deg,#7FCBF0,#1F7DB4)">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#0E1319" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 8l7-5 7 5"/><path d="M5 8v6a7 7 0 0 0 14 0V8"/></svg>
      </div>
      <h1 class="font-display text-2xl font-semibold relative">Staff account recovery</h1>
      <p class="text-[#9AA6B2] mt-2 max-w-xs relative">We'll help you get back to your tasks and daily logs.</p>
    </div>

    <div class="bg-white rounded-t-3xl p-6 pb-8" style="box-shadow:0 -8px 30px rgba(0,0,0,.2)">
      <div id="requestState">
        <h2 class="font-display text-lg font-semibold mb-1">Forgot password?</h2>
        <p class="text-sm text-grey-500 mb-5">Enter your work email address.</p>
        <form id="form" class="space-y-4">
          <div><label class="label">Work email</label><input class="field !py-3" type="email" id="email" value="rokafor@copperkettle.co" required></div>
          <button type="submit" class="btn btn-primary big-btn w-full">Send recovery link</button>
        </form>
      </div>
      <div id="sentState" class="hidden text-center py-4">
        <div class="w-12 h-12 rounded-full bg-ok-bg text-ok grid place-items-center mx-auto mb-3">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="font-semibold text-ink">Recovery link sent!</div>
        <p class="text-sm text-grey-500 mt-1">Check your inbox for login instructions.</p>
      </div>
      <div class="text-center text-sm text-grey-500 mt-5">
        <a href="login.html" class="text-brand-700 font-medium">Back to staff sign in</a>
      </div>
    </div>
  </div>

  <script src="../assets/js/ui.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', (e)=>{
      e.preventDefault();
      document.getElementById('requestState').classList.add('hidden');
      document.getElementById('sentState').classList.remove('hidden');
      UI.toast('Staff reset link sent', 'success');
    });
  </script>
</body>
</html>
